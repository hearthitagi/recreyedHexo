name: 自动部署

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成静态文件
        env:
          TZ: Asia/Shanghai
        run: |
          npx hexo clean
          npx hexo generate

      - name: 部署
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GITHUBTOKEN }}
          external_repository: ${{ secrets.GITHUBUSERNAME }}/${{ secrets.GITHUBUSERNAME }}.github.io
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
          user_name: ${{ secrets.GITHUBUSERNAME }}
          user_email: ${{ secrets.GITHUBEMAIL }}
          commit_message: ${{ github.event.head_commit.message || 'Update by GitHub Actions' }}
